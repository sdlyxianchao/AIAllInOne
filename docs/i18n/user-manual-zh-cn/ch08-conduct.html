      <div class="sub">使用平台的基本规矩。</div>
    </div>

    <h2>8.1 使用规范</h2>
    <ul>
      <li>不用于违法违规用途，不生成违法、有害、侵权内容；</li>
      <li>不绕过平台安全限制，不批量刷额度；</li>
      <li>对外发送 AI 生成内容时，核实事实并遵守公司信息发布规范；</li>
      <li>妥善保管自己的 API Key，不转借他人、不提交到代码仓库；</li>
      <li>发现异常（账号异常、内容异常）及时报告管理员。</li>
    </ul>

    <h2>8.2 一句话总结</h2>
    <div class="tip">✅ 善用 AI 提效，但<b>机密不发、事实必核、规矩要守</b>。有问题联系平台管理员。</div>
