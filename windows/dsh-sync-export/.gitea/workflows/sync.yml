name: DSH Desktop Sync

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      sync_version:
        description: 'Sync a specific version (e.g. v0.7.1). Leave empty for auto-sync latest.'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    container:
      image: python:3-alpine
      # docker.sock 由 act_runner 自动挂载，不要在这里重复挂载（会报 Duplicate mount point）
      # dsh-updates 通过 Docker API 直接写入 update-server 容器，不需要本地 volume
    steps:
      - name: Install dependencies
        shell: sh
        run: apk add --no-cache curl
      - name: Download sync script from Gitea
        shell: sh
        run: |
          wget -q -O sync_download.py "http://gitea:3000/ai_all_in_one_admin/dsh-sync/raw/branch/main/sync_download.py"
          wget -q -O sync-config.json "http://gitea:3000/ai_all_in_one_admin/dsh-sync/raw/branch/main/sync-config.json"
      - name: Sync DSH Desktop installers
        shell: sh
        run: |
          ARGS=""
          if [ -n "$SYNC_VERSION" ]; then
            ARGS="--sync-version $SYNC_VERSION"
          fi
          PYTHONUNBUFFERED=1 python3 sync_download.py $ARGS
        env:
          SYNC_VERSION: ${{ github.event.inputs.sync_version }}
