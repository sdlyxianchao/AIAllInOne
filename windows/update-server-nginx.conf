# Update Server (DSH Desktop 安装包分发) — nginx 配置
# 开启 autoindex 目录浏览：根 / 不再 403，直接列出安装包文件。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex on;
    autoindex_exact_size off;   # 文件大小显示为可读单位（KB/MB）
    autoindex_localtime on;
    charset utf-8;
    # 允许 Ghost 下载页跨源 HEAD 检查文件是否可下载（用于灰显不可用链接）
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;
    # db/ 是 Admin Center 的 SQLite（版本表 + 同步历史），它只是「顺带」落在 webroot 里，
    # 没有任何客户端需要从这里取。别让 :8091 匿名下到整个库（autoindex 开着还能浏览目录）。
    location /db/ {
        deny all;
        return 403;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
